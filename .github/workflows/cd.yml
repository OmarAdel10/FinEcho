name: FinEcho Release Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target (flavor builds are deferred)'
        required: true
        default: staging
        type: choice
        options:
          - production
          - staging
          - development
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: finecho-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    name: Build standard release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-stable-${{ hashFiles('pubspec.lock') }}
          pub-cache-key: pub-cache-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build standard release APK
        run: |
          echo "Requested target: ${{ inputs.target }}"
          echo "Android flavors are not configured yet; building the standard release APK."
          flutter build apk --release

      - name: Upload standard release APK
        uses: actions/upload-artifact@v4
        with:
          name: finecho-standard-release-apk-${{ inputs.target }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
