<script>
  (function () {
    const track = document.getElementById('loading-track');
    const label = document.getElementById('loading-label');
    const pct = document.getElementById('loading-pct');

    if (!track || !label || !pct) return;

    const milestones = [
      { progress: 28, text: 'Initializing offline vault...' },
      { progress: 54, text: 'Verifying local state...' },
      { progress: 82, text: 'Opening ledger records...' },
      { progress: 100, text: 'Ledger ready' }
    ];

    let currentStep = 0;

    const interval = setInterval(() => {
      currentStep++;
      if (currentStep < milestones.length) {
        const item = milestones[currentStep];
        track.style.width = item.progress + '%';
        pct.textContent = item.progress + '%';
        label.textContent = item.text;
      } else {
        clearInterval(interval);
      }
    }, 650);
  })();
